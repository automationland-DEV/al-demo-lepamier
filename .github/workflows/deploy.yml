name: Build and Deploy

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Nếu dự án Vite của bạn cần file .env, bạn có thể tạo ở đây. 
      # Lưu ý biến môi trường của Vite thường bắt đầu bằng VITE_ thay vì NEXT_PUBLIC_
      # - name: Create .env file
      #   run: |
      #     echo "VITE_API_URL=https://api.example.com" > .env
    
      - name: Check Linting
        run: npm run lint --if-present

      - name: Build Project
        run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Deploy 
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            # 1. Đi vào thư mục gốc của dự án trên VPS 
            # (Thay thế đường dẫn này bằng thư mục thật chứa dự án al-demo-lepamier trên server của bạn)
            cd /home/ubuntu/al-demo-lepamier

            # 2. Cập nhật code mới nhất từ nhánh main
            git fetch --all
            git reset --hard origin/main

            # 3. Build lại và chạy container
            docker compose down
            docker compose up -d --build
            docker ps
